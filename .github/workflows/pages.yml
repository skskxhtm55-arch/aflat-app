# web 폴더를 GitHub Pages 로 자동 배포합니다.
# main 브랜치에 web 폴더 변경을 올리면(push) 1~2분 뒤 앱 주소에 반영됩니다.
# 최초 1회: 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 선택
name: 화면 배포 (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ['web/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
