# web 폴더를 GitHub Pages 로 자동 배포합니다.
# main 브랜치에 web 폴더 변경을 올리면(push) 1~2분 뒤 앱 주소에 반영됩니다.
# 최초 1회: 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 선택
name: 화면 배포 (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      # GitHub 쪽에서 가끔 "artifact를 찾을 수 없음"으로 실패해 30초 뒤 한 번 더 시도합니다.
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
